name: Build Sturdyfishstick Plugins

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.12"

      - name: Normalize Manifests & Prepare Environment
        run: |
          find . -name "AndroidManifest.xml" -exec sed -i 's/package="[^"]*"//g' {} +
          echo "Environment ready."

      - name: Build Plugins & Manifests
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ -f "gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            chmod +x gradlew
            ./gradlew make makePluginsJson --stacktrace || ./gradlew make --stacktrace
          else
            gradle make makePluginsJson --stacktrace || gradle make --stacktrace
          fi

      - name: Ensure Real Plugin Names, Official Logos & Valid Hashes
        run: |
          python3 - << 'EOF'
          import json, glob, zipfile, os, hashlib

          PLUGIN_META = {
              'BlakitePlugin': {
                  'name': 'Blakite Anime',
                  'iconUrl': 'https://blogger.googleusercontent.com/img/a/AVvXsEgWJNM8v7dkKlHDuBncLOZsjiURJtbxv6de_W_TkIg75W51emlvr-3DATj02j__QUikkzjxhYKv8jYtQp4lc04xObvSTvthIHg_DA0Ud4SRiEUKqralljdfKnUumPN96NEBQwW6y0SpVKcCCPzuIwh8on5sgzjH7BT5PpR6_vp_qS7Qia8OMj04qz-DyMw=s937'
              },
              'ZLivePlugin': {
                  'name': 'ZLive',
                  'iconUrl': 'https://ui-avatars.com/api/?name=ZLive&background=0d0d0d&color=8288fe&size=512&bold=true&length=2'
              },
              'AnimeDekhoPlugin': {
                  'name': 'AnimeDekho',
                  'iconUrl': 'https://animedekho.app/wp-content/uploads/2023/02/cropped-favicon-270x270.png'
              }
          }

          # Map base filename and stem to (hash, size)
          cs3_info_by_base = {}
          cs3_info_by_stem = {}

          for cs3_file in sorted(glob.glob('**/*.cs3', recursive=True)):
              base = os.path.basename(cs3_file)
              stem = os.path.splitext(base)[0]
              internal_from_manifest = ''

              with zipfile.ZipFile(cs3_file, 'r') as zin:
                  items = {name: zin.read(name) for name in zin.namelist()}

              if 'manifest.json' in items:
                  manifest = json.loads(items['manifest.json'].decode('utf-8'))
                  internal_from_manifest = manifest.get('internalName', '')

                  for plugin_key, meta in PLUGIN_META.items():
                      if (
                          plugin_key.lower() in base.lower()
                          or internal_from_manifest.lower() == plugin_key.lower()
                      ):
                          manifest['name'] = meta['name']
                          if 'iconUrl' in meta:
                              manifest['iconUrl'] = meta['iconUrl']

                  items['manifest.json'] = json.dumps(manifest, indent=2).encode('utf-8')
                  with zipfile.ZipFile(cs3_file, 'w', zipfile.ZIP_DEFLATED) as zout:
                      for name, data in items.items():
                          zout.writestr(name, data)

              with open(cs3_file, 'rb') as f:
                  content = f.read()

              h = 'sha256-' + hashlib.sha256(content).hexdigest()
              sz = len(content)
              info = (h, sz, base)

              cs3_info_by_base[base.lower()] = info
              cs3_info_by_stem[stem.lower()] = info
              if internal_from_manifest:
                  cs3_info_by_stem[internal_from_manifest.lower()] = info

          print("Calculated CS3 hashes:", {k: (v[2], v[0], v[1]) for k, v in cs3_info_by_base.items()})

          def find_match_for_item(item):
              iname = (item.get('internalName') or '').lower()
              url = (item.get('url') or '').lower()

              # 1. Exact base filename match in URL
              for base_l, info in cs3_info_by_base.items():
                  if base_l in url:
                      return info

              # 2. internalName match
              if iname and iname in cs3_info_by_stem:
                  return cs3_info_by_stem[iname]

              # 3. Stem match in URL or internalName
              for stem_l, info in cs3_info_by_stem.items():
                  if stem_l and (stem_l in url or stem_l in iname):
                      return info

              return None

          for pjson in ['build/plugins.json', 'plugins.json']:
              if os.path.exists(pjson):
                  with open(pjson, 'r', encoding='utf-8') as f:
                      data = json.load(f)

                  for item in data:
                      iname = item.get('internalName', '')
                      url = item.get('url', '')

                      for plugin_key, meta in PLUGIN_META.items():
                          if iname.lower() == plugin_key.lower() or plugin_key.lower() in url.lower():
                              item['name'] = meta['name']
                              item['iconUrl'] = meta['iconUrl']

                      matched = find_match_for_item(item)
                      if matched:
                          h, sz, matched_base = matched
                          item['fileHash'] = h
                          item['fileSize'] = sz
                          print(f"Updated {pjson} -> {iname or matched_base}: {h} ({sz} bytes)")
                      else:
                          print(f"WARNING: No .cs3 match found in {pjson} for internalName='{iname}', url='{url}'")

                  with open(pjson, 'w', encoding='utf-8') as f:
                      json.dump(data, f, indent=2)
          EOF

      - name: Verify Output Artifacts
        run: |
          echo "=== Verifying Generated Files ==="
          rm -rf $RUNNER_TEMP/build_artifacts
          mkdir -p $RUNNER_TEMP/build_artifacts
          find . -name "*.cs3" -exec cp -f {} $RUNNER_TEMP/build_artifacts/ \;
          find . -name "*.jar" ! -name "gradle-wrapper.jar" -exec cp -f {} $RUNNER_TEMP/build_artifacts/ \;
          if [ -f "build/plugins.json" ]; then
            cp -f build/plugins.json $RUNNER_TEMP/build_artifacts/plugins.json
          elif [ -f "plugins.json" ]; then
            cp -f plugins.json $RUNNER_TEMP/build_artifacts/plugins.json
          fi
          if [ -f "repo.json" ]; then
            cp -f repo.json $RUNNER_TEMP/build_artifacts/repo.json
          fi
          ls -la $RUNNER_TEMP/build_artifacts/

      - name: Upload Build Artifacts (Zip)
        uses: actions/upload-artifact@v4
        with:
          name: allanime-plugins
          path: ${{ runner.temp }}/build_artifacts/*
          retention-days: 14

      - name: Deploy to Builds Branch
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git checkout -B builds
          find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +
          cp -r $RUNNER_TEMP/build_artifacts/* ./
          git add -A
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit."
          else
            git commit -m "Automated Allanime build: ${{ github.sha }}"
            git push origin builds --force
          fi
